name: Daily Cron Jobs

on:
  schedule:
    # Daily at 8:00 AM EAT (5:00 AM UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  renewal-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send renewal reminders
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://hustledesk-api-9qwl.onrender.com/api/cron/renewal-reminders

  weekly-summary:
    runs-on: ubuntu-latest
    # Only run on Sundays (day 0)
    if: github.event.schedule == '0 5 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Send weekly summaries
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://hustledesk-api-9qwl.onrender.com/api/cron/weekly-summary
