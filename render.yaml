services:
  - type: web
    name: hustledesk-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server.app:create_app()
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hustledesk-db
          property: connectionString

databases:
  - name: hustledesk-db
    plan: free
